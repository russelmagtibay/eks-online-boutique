# ============================================================================
# TOP HALF: Deployment (Hires & Watches Worker #2: The Product Catalog Keeper)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  namespace: boutique
  labels:
    app.kubernetes.io/name: productcatalogservice
    app.kubernetes.io/part-of: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice:v0.10.2
          ports:
            - name: grpc
              containerPort: 3550
          env:
            - name: PORT
              value: "3550"
            - name: DISABLE_PROFILER
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          readinessProbe:
            grpc:
              port: 3550
            initialDelaySeconds: 5
          livenessProbe:
            grpc:
              port: 3550
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# ============================================================================
# BOTTOM HALF: Service (Walkie-Talkie Name: productcatalogservice:3550)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  namespace: boutique
  labels:
    app.kubernetes.io/name: productcatalogservice
    app.kubernetes.io/part-of: online-boutique
spec:
  type: ClusterIP
  selector:
    app: productcatalogservice
  ports:
    - name: grpc
      port: 3550
      targetPort: 3550