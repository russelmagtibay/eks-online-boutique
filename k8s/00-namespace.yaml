apiVersion: v1
kind: Namespace
metadata:
  name: boutique
  labels:
    # 1. Official Kubernetes Recommended Labels (for observability & ArgoCD/Helm tracking)
    app.kubernetes.io/name: online-boutique
    app.kubernetes.io/part-of: microservices-platform
    app.kubernetes.io/managed-by: kubectl
    environment: production

    # 2. Built-in Kubernetes Pod Security Standards (PSS)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted