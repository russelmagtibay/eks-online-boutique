# ============================================================================
# TOP HALF: Deployment (Hires & Watches Worker #4: The Shipping Calculator)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  namespace: boutique
  labels:
    app.kubernetes.io/name: shippingservice
    app.kubernetes.io/part-of: online-boutique
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shippingservice
  template:
    metadata:
      labels:
        app: shippingservice
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/shippingservice:v0.10.2
          ports:
            - name: grpc
              containerPort: 50051           # 🐧 Standard unprivileged Linux gRPC port (>= 1024)
          env:
            - name: PORT
              value: "50051"
            - name: DISABLE_PROFILER
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL                        # Drops CAP_NET_BIND_SERVICE and all root capabilities
            privileged: false
            readOnlyRootFilesystem: true
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# ============================================================================
# BOTTOM HALF: Service (Walkie-Talkie Name: shippingservice:50051)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  namespace: boutique
  labels:
    app.kubernetes.io/name: shippingservice
    app.kubernetes.io/part-of: online-boutique
spec:
  type: ClusterIP
  selector:
    app: shippingservice
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051